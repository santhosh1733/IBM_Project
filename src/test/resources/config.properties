# ==============================
# ParaBank Automation Config
# ==============================

# Application under test
url=https://parabank.parasoft.com/parabankv2/index.htm

# Browser: chrome | firefox | edge
browser=chrome

# Test login credentials (used by BillPayTest; can be overridden with Maven -D properties)
parabank.username=Test123
parabank.password=Test123

# Chrome automation preferences
# Keep these false to prevent password-save / compromised-password browser popups
chrome.credentials.service.enabled=false
chrome.password.manager.enabled=false
chrome.password.leak.detection.enabled=false

# Run mode: true = headless (for CI), false = show browser (local debugging)
headless=false

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Test data file (Apache POI reads this)
testdata.path=testdata/TestData.xlsx

# Reports output
report.path=test-output/ExtentReport.html
